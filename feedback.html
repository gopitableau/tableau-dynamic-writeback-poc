<!DOCTYPE html>
<html>

<head>

    <title>Dynamic Tableau Data</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #17233c;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #6f7b8f;
            font-size: 13px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        select {
            width: 100%;
            height: 40px;
            box-sizing: border-box;

            border: 1px solid #ccd2dc;
            border-radius: 5px;

            padding: 8px;
            font-size: 13px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #2c6bed;
        }

        #status {
            margin: 10px 0;
            font-size: 12px;
            color: #6f7b8f;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d9dde5;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f4f6f9;
            font-weight: 600;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #d9dde5;
            white-space: nowrap;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #e5e8ed;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .input-cell {
            min-width: 140px;
        }

        .user-input {
            width: 120px;
            height: 32px;
            box-sizing: border-box;

            border: 1px solid #ccd2dc;
            border-radius: 5px;

            padding: 6px 8px;
            font-size: 12px;
        }

        .user-input:focus {
            outline: none;
            border-color: #2c6bed;
        }

        .no-data {
            padding: 20px;
            text-align: center;
            color: #6f7b8f;
            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Tableau Worksheet Data
    </h1>

    <div class="subtitle">
        Select a worksheet and enter values for the required rows.
    </div>


    <div class="field">

        <label for="worksheetSelect">
            Select Worksheet
        </label>

        <select id="worksheetSelect">

            <option value="">
                Loading worksheets...
            </option>

        </select>

    </div>


    <div id="status">
        Initializing...
    </div>


    <div
        id="tableContainer"
        class="table-container">

    </div>

</div>


<script src="./tableau.extensions.1.latest.js"></script>


<script>

    /*
     * Store the Tableau worksheets.
     */

    let worksheets = [];


    /*
     * Get HTML elements.
     */

    const worksheetSelect =
        document.getElementById("worksheetSelect");

    const status =
        document.getElementById("status");

    const tableContainer =
        document.getElementById("tableContainer");


    /*
     * Initialize Tableau Dialog.
     */

    tableau.extensions.initializeDialogAsync()

        .then(() => {

            console.log(
                "Tableau dialog initialized"
            );


            /*
             * Get worksheets from
             * the current dashboard.
             */

            worksheets =
                tableau.extensions
                    .dashboardContent
                    .dashboard
                    .worksheets;


            console.log(
                "Worksheets:",
                worksheets
            );


            /*
             * Check whether worksheets exist.
             */

            if (!worksheets || worksheets.length === 0) {

                status.innerText =
                    "No worksheets found on this dashboard.";

                worksheetSelect.innerHTML =
                    "<option value=''>No worksheets available</option>";

                return;

            }


            /*
             * Populate worksheet dropdown.
             */

            worksheetSelect.innerHTML =
                "<option value=''>Select a worksheet</option>";


            worksheets.forEach(
                (worksheet, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;

                    option.textContent =
                        worksheet.name;

                    worksheetSelect.appendChild(
                        option
                    );

                }
            );


            status.innerText =
                "Select a worksheet to load its data.";

        })

        .catch((error) => {

            console.error(
                "Dialog initialization error:",
                error
            );

            status.innerText =
                "Unable to connect to Tableau.";

        });


    /*
     * When the user selects
     * a worksheet.
     */

    worksheetSelect.addEventListener(
        "change",
        async () => {

            const selectedIndex =
                worksheetSelect.value;


            /*
             * No worksheet selected.
             */

            if (selectedIndex === "") {

                tableContainer.innerHTML = "";

                status.innerText =
                    "Select a worksheet to load its data.";

                return;

            }


            const worksheet =
                worksheets[
                    Number(selectedIndex)
                ];


            status.innerText =
                "Loading worksheet data...";

            tableContainer.innerHTML = "";


            try {

                console.log(
                    "Selected worksheet:",
                    worksheet.name
                );


                /*
                 * Read worksheet summary data.
                 */

                const dataTableReader =
                    await worksheet
                        .getSummaryDataReaderAsync();


                /*
                 * Retrieve all pages.
                 */

                const dataTable =
                    await dataTableReader
                        .getAllPagesAsync();


                /*
                 * Release the reader.
                 */

                await dataTableReader.releaseAsync();


                console.log(
                    "Data table:",
                    dataTable
                );


                /*
                 * Display the Tableau data
                 * plus the editable column.
                 */

                displayTable(dataTable);


                status.innerText =
                    "Loaded " +
                    dataTable.data.length +
                    " rows from " +
                    worksheet.name;

            }

            catch (error) {

                console.error(
                    "Error reading worksheet data:",
                    error
                );

                status.innerText =
                    "Unable to read worksheet data.";

                tableContainer.innerHTML =
                    "<div class='no-data'>" +
                    "Error loading worksheet data. " +
                    "Check the browser console for details." +
                    "</div>";

            }

        }
    );


    /*
     * Display Tableau DataTable
     * as an editable HTML table.
     */

    function displayTable(dataTable) {

        /*
         * Clear previous table.
         */

        tableContainer.innerHTML = "";


        /*
         * Check for columns.
         */

        if (
            !dataTable ||
            !dataTable.columns ||
            dataTable.columns.length === 0
        ) {

            tableContainer.innerHTML =
                "<div class='no-data'>" +
                "No columns found." +
                "</div>";

            return;

        }


        /*
         * Check for rows.
         */

        if (
            !dataTable.data ||
            dataTable.data.length === 0
        ) {

            tableContainer.innerHTML =
                "<div class='no-data'>" +
                "No rows found." +
                "</div>";

            return;

        }


        /*
         * Create HTML table.
         */

        const table =
            document.createElement("table");


        /*
         * Create table header.
         */

        const thead =
            document.createElement("thead");

        const headerRow =
            document.createElement("tr");


        /*
         * Add all Tableau columns dynamically.
         */

        dataTable.columns.forEach(
            (column) => {

                const th =
                    document.createElement("th");

                th.textContent =
                    column.fieldName;

                headerRow.appendChild(th);

            }
        );


        /*
         * Add our extension column.
         */

        const inputHeader =
            document.createElement("th");

        inputHeader.textContent =
            "User Input";

        headerRow.appendChild(
            inputHeader
        );


        thead.appendChild(
            headerRow
        );

        table.appendChild(
            thead
        );


        /*
         * Create table body.
         */

        const tbody =
            document.createElement("tbody");


        /*
         * Create one row for every
         * Tableau data row.
         */

        dataTable.data.forEach(
            (row, rowIndex) => {

                const tr =
                    document.createElement("tr");


                /*
                 * Add Tableau values.
                 */

                row.forEach(
                    (cell) => {

                        const td =
                            document.createElement("td");


                        if (
                            cell &&
                            cell.formattedValue !== undefined
                        ) {

                            td.textContent =
                                cell.formattedValue;

                        }

                        else if (
                            cell &&
                            cell.value !== undefined
                        ) {

                            td.textContent =
                                cell.value;

                        }

                        else {

                            td.textContent = "";

                        }


                        tr.appendChild(td);

                    }
                );


                /*
                 * Add editable input.
                 */

                const inputCell =
                    document.createElement("td");

                inputCell.className =
                    "input-cell";


                const input =
                    document.createElement("input");

                input.type = "text";

                input.className =
                    "user-input";

                input.placeholder =
                    "Enter value";


                /*
                 * Store the Tableau row index
                 * on the input element.
                 */

                input.dataset.rowIndex =
                    rowIndex;


                inputCell.appendChild(
                    input
                );


                tr.appendChild(
                    inputCell
                );


                tbody.appendChild(
                    tr
                );

            }
        );


        table.appendChild(
            tbody
        );


        tableContainer.appendChild(
            table
        );

    }

</script>

</body>

</html>
