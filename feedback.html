<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Dynamic Tableau Writeback</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 12px;
            background-color: #f8f9fa;
            font-size: 12px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        select {
            padding: 5px;
            min-width: 200px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .status {
            margin: 4px 0 8px 0;
            font-weight: bold;
            font-size: 11px;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ddd;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 700px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 5px 7px;
            text-align: left;
            white-space: nowrap;
            font-size: 11px;
        }

        th {
            background-color: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .user-input,
        .new-row-input,
        .new-row-user-input {
            width: 100px;
            padding: 4px;
            box-sizing: border-box;
            font-size: 11px;
        }

        .new-row td {
            background-color: #fffdf2;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 11px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-button {
            background-color: #198754;
            color: white;
        }

        .submit-button {
            background-color: #0d6efd;
            color: white;
        }

        .send-email-button {
            background-color: #6f42c1;
            color: white;
        }

        .remove-button {
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            font-size: 10px;
        }

        button:hover {
            opacity: 0.9;
        }


        /* --------------------------------------------------
           Submit result message
        -------------------------------------------------- */

        .submit-status {
            display: none;
            margin-top: 8px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
        }

        .submit-success {
            display: block;
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .submit-error {
            display: block;
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }


        /* --------------------------------------------------
           Email modal
        -------------------------------------------------- */

        .email-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .email-modal-content {
            background-color: white;
            width: 420px;
            max-width: 90%;
            padding: 18px;
            border-radius: 6px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .email-modal-title {
            margin: 0 0 14px 0;
            font-size: 15px;
        }

        .email-field {
            margin-bottom: 10px;
        }

        .email-field label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 11px;
        }

        .email-field input,
        .email-field textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 7px;
            font-family: Arial, sans-serif;
            font-size: 11px;
        }

        .email-field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .email-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }

        .cancel-email-button {
            background-color: #6c757d;
            color: white;
        }

        .confirm-email-button {
            background-color: #6f42c1;
            color: white;
        }

        .email-status {
            display: none;
            margin-top: 10px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
        }

        .email-success {
            display: block;
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .email-error {
            display: block;
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

    </style>

</head>


<body>

    <h2>Tableau Worksheet Data</h2>


    <label for="worksheetSelect">
        <strong>Select Worksheet:</strong>
    </label>

    <br>

    <select id="worksheetSelect">

        <option value="">
            -- Select Worksheet --
        </option>

    </select>


    <div id="status" class="status"></div>


    <div class="table-wrapper">

        <div id="tableContainer"></div>

    </div>


    <div id="actions"
         class="actions"
         style="display:none;">

        <button
            id="addRowButton"
            class="add-button">

            + Add Row

        </button>


        <button
            id="submitButton"
            class="submit-button">

            Submit All

        </button>


        <!-- NEW: Send Email button -->

        <button
            id="sendEmailButton"
            class="send-email-button">

            Send Email

        </button>

    </div>


    <!-- Submit result -->

    <div
        id="submitStatus"
        class="submit-status">
    </div>


    <!-- ==================================================
         SEND EMAIL MODAL
         ================================================== -->

    <div
        id="emailModal"
        class="email-modal">

        <div class="email-modal-content">

            <h3 class="email-modal-title">
                Send Feedback
            </h3>


            <!-- To -->

            <div class="email-field">

                <label for="emailTo">
                    To *
                </label>

                <input
                    type="email"
                    id="emailTo"
                    placeholder="developer@company.com">

            </div>


            <!-- Your Name -->

            <div class="email-field">

                <label for="emailName">
                    Your Name *
                </label>

                <input
                    type="text"
                    id="emailName"
                    placeholder="John Smith">

            </div>


            <!-- Your Email -->

            <div class="email-field">

                <label for="emailFrom">
                    Your Email *
                </label>

                <input
                    type="email"
                    id="emailFrom"
                    placeholder="john.smith@client.com">

            </div>


            <!-- Subject -->

            <div class="email-field">

                <label for="emailSubject">
                    Subject
                </label>

                <input
                    type="text"
                    id="emailSubject"
                    placeholder="Tableau Feedback">

            </div>


            <!-- Message -->

            <div class="email-field">

                <label for="emailMessage">
                    Feedback / Message *
                </label>

                <textarea
                    id="emailMessage"
                    placeholder="Enter your feedback here..."></textarea>

            </div>


            <!-- Email status -->

            <div
                id="emailStatus"
                class="email-status">
            </div>


            <!-- Buttons -->

            <div class="email-actions">

                <button
                    id="cancelEmailButton"
                    class="cancel-email-button">

                    Cancel

                </button>


                <button
                    id="confirmEmailButton"
                    class="confirm-email-button">

                    Send Email

                </button>

            </div>

        </div>

    </div>


    <script src="tableau.extensions.1.latest.js"></script>


    <script>


        // --------------------------------------------------
        // Google Apps Script Web App URL
        // --------------------------------------------------

        const WRITEBACK_URL =
            "https://script.google.com/macros/s/AKfycbwNup0y3TImWTO6RR5gTaFBiziHHbwahKIvNSPBhPEUhlRiDBIgzEW4KYTePFyNBNs84A/exec";


        // --------------------------------------------------
        // Global variables
        // --------------------------------------------------

        let worksheets = [];

        let currentDataTable = null;

        let currentWorksheetName = "";

        let newRowCounter = 0;


        // --------------------------------------------------
        // HTML elements
        // --------------------------------------------------

        const worksheetSelect =
            document.getElementById(
                "worksheetSelect"
            );


        const status =
            document.getElementById(
                "status"
            );


        const tableContainer =
            document.getElementById(
                "tableContainer"
            );


        const actions =
            document.getElementById(
                "actions"
            );


        const addRowButton =
            document.getElementById(
                "addRowButton"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const submitStatus =
            document.getElementById(
                "submitStatus"
            );


        // --------------------------------------------------
        // NEW: Email elements
        // --------------------------------------------------

        const sendEmailButton =
            document.getElementById(
                "sendEmailButton"
            );


        const emailModal =
            document.getElementById(
                "emailModal"
            );


        const emailTo =
            document.getElementById(
                "emailTo"
            );


        const emailName =
            document.getElementById(
                "emailName"
            );


        const emailFrom =
            document.getElementById(
                "emailFrom"
            );


        const emailSubject =
            document.getElementById(
                "emailSubject"
            );


        const emailMessage =
            document.getElementById(
                "emailMessage"
            );


        const cancelEmailButton =
            document.getElementById(
                "cancelEmailButton"
            );


        const confirmEmailButton =
            document.getElementById(
                "confirmEmailButton"
            );


        const emailStatus =
            document.getElementById(
                "emailStatus"
            );


        // --------------------------------------------------
        // Initialize Tableau Extension
        // --------------------------------------------------

        tableau.extensions.initializeDialogAsync()

            .then(function () {

                status.textContent =
                    "Ready";

                loadWorksheets();

            })

            .catch(function (error) {

                status.textContent =
                    "Initialization failed";

                console.error(error);

            });


        // --------------------------------------------------
        // Load worksheets from current dashboard
        // --------------------------------------------------

        async function loadWorksheets() {

            try {

                const dashboard =
                    tableau.extensions
                        .dashboardContent
                        .dashboard;


                worksheets =
                    dashboard.worksheets;


                worksheetSelect.innerHTML =
                    '<option value="">-- Select Worksheet --</option>';


                worksheets.forEach(
                    function (worksheet, index) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            index;


                        option.textContent =
                            worksheet.name;


                        worksheetSelect.appendChild(
                            option
                        );

                    }
                );


                status.textContent =
                    "Ready";

            }

            catch (error) {

                status.textContent =
                    "Unable to load worksheets";

                console.error(error);

            }

        }


        // --------------------------------------------------
        // Worksheet selection
        // --------------------------------------------------

        worksheetSelect.addEventListener(
            "change",
            async function () {

                const selectedIndex =
                    worksheetSelect.value;


                // Hide previous submit message

                submitStatus.style.display =
                    "none";

                submitStatus.className =
                    "submit-status";


                // Hide previous email message

                emailStatus.style.display =
                    "none";

                emailStatus.className =
                    "email-status";


                if (selectedIndex === "") {

                    tableContainer.innerHTML =
                        "";

                    actions.style.display =
                        "none";

                    currentDataTable =
                        null;

                    currentWorksheetName =
                        "";

                    return;

                }


                try {

                    status.textContent =
                        "Loading...";


                    newRowCounter =
                        0;


                    const worksheet =
                        worksheets[
                            selectedIndex
                        ];


                    currentWorksheetName =
                        worksheet.name;


                    const dataTableReader =
                        await worksheet
                            .getSummaryDataReaderAsync();


                    const dataTable =
                        await dataTableReader
                            .getAllPagesAsync();


                    await dataTableReader
                        .releaseAsync();


                    currentDataTable =
                        dataTable;


                    displayTable(
                        dataTable
                    );


                    actions.style.display =
                        "flex";


                    status.textContent =
                        "Loaded";

                }

                catch (error) {

                    status.textContent =
                        "Unable to load worksheet data";

                    console.error(error);

                }

            }

        );


        // --------------------------------------------------
        // Display Tableau data
        // --------------------------------------------------

        function displayTable(dataTable) {

            tableContainer.innerHTML =
                "";


            const table =
                document.createElement(
                    "table"
                );


            const thead =
                document.createElement(
                    "thead"
                );


            const headerRow =
                document.createElement(
                    "tr"
                );


            // Tableau columns

            dataTable.columns.forEach(
                function (column) {

                    const th =
                        document.createElement(
                            "th"
                        );


                    th.textContent =
                        column.fieldName;


                    headerRow.appendChild(
                        th
                    );

                }
            );


            // User Input column

            const userInputHeader =
                document.createElement(
                    "th"
                );


            userInputHeader.textContent =
                "User Input";


            headerRow.appendChild(
                userInputHeader
            );


            // Empty action column

            const actionHeader =
                document.createElement(
                    "th"
                );


            actionHeader.textContent =
                "";


            headerRow.appendChild(
                actionHeader
            );


            thead.appendChild(
                headerRow
            );


            table.appendChild(
                thead
            );


            const tbody =
                document.createElement(
                    "tbody"
                );


            // --------------------------------------------------
            // Existing Tableau rows
            // --------------------------------------------------

            dataTable.data.forEach(
                function (row, rowIndex) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    dataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const td =
                                document.createElement(
                                    "td"
                                );


                            const cell =
                                row[
                                    columnIndex
                                ];


                            td.textContent =
                                cell.formattedValue ??
                                cell.value ??
                                "";


                            tr.appendChild(
                                td
                            );

                        }
                    );


                    // User Input

                    const userInputTd =
                        document.createElement(
                            "td"
                        );


                    const userInput =
                        document.createElement(
                            "input"
                        );


                    userInput.type =
                        "text";


                    userInput.className =
                        "user-input";


                    userInput.placeholder =
                        "Enter value";


                    userInput.dataset.rowIndex =
                        rowIndex;


                    userInputTd.appendChild(
                        userInput
                    );


                    tr.appendChild(
                        userInputTd
                    );


                    // Empty action cell

                    const actionTd =
                        document.createElement(
                            "td"
                        );


                    tr.appendChild(
                        actionTd
                    );


                    tbody.appendChild(
                        tr
                    );

                }
            );


            table.appendChild(
                tbody
            );


            tableContainer.appendChild(
                table
            );

        }


        // --------------------------------------------------
        // Add new row
        // --------------------------------------------------

        addRowButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                const table =
                    tableContainer
                        .querySelector(
                            "table"
                        );


                const tbody =
                    table.querySelector(
                        "tbody"
                    );


                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.className =
                    "new-row";


                tr.dataset.newRowId =
                    newRowCounter;


                newRowCounter++;


                // Tableau columns

                currentDataTable.columns.forEach(
                    function (
                        column,
                        columnIndex
                    ) {

                        const td =
                            document.createElement(
                                "td"
                            );


                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "text";


                        input.className =
                            "new-row-input";


                        input.placeholder =
                            column.fieldName;


                        input.dataset.columnIndex =
                            columnIndex;


                        td.appendChild(
                            input
                        );


                        tr.appendChild(
                            td
                        );

                    }
                );


                // User Input

                const userInputTd =
                    document.createElement(
                        "td"
                    );


                const userInput =
                    document.createElement(
                        "input"
                    );


                userInput.type =
                    "text";


                userInput.className =
                    "new-row-user-input";


                userInput.placeholder =
                    "Enter value";


                userInputTd.appendChild(
                    userInput
                );


                tr.appendChild(
                    userInputTd
                );


                // Remove button

                const actionTd =
                    document.createElement(
                        "td"
                    );


                const removeButton =
                    document.createElement(
                        "button"
                    );


                removeButton.textContent =
                    "Remove";


                removeButton.className =
                    "remove-button";


                removeButton.addEventListener(
                    "click",
                    function () {

                        tr.remove();

                    }
                );


                actionTd.appendChild(
                    removeButton
                );


                tr.appendChild(
                    actionTd
                );


                tbody.appendChild(
                    tr
                );


                // Hide old success message
                // when adding another row

                submitStatus.style.display =
                    "none";

                submitStatus.className =
                    "submit-status";


                status.textContent =
                    "New row added";

            }
        );


        // --------------------------------------------------
        // Build payload internally
        // --------------------------------------------------

        function buildPayload() {

            const records = [];


            // --------------------------------------------------
            // Existing Tableau rows
            // --------------------------------------------------

            const existingInputs =
                document.querySelectorAll(
                    ".user-input"
                );


            existingInputs.forEach(
                function (input) {

                    const userValue =
                        input.value.trim();


                    // Ignore empty inputs

                    if (userValue === "") {

                        return;

                    }


                    const rowIndex =
                        Number(
                            input.dataset.rowIndex
                        );


                    const tableauRow =
                        currentDataTable
                            .data[rowIndex];


                    const rowObject = {};


                    currentDataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const cell =
                                tableauRow[
                                    columnIndex
                                ];


                            rowObject[
                                column.fieldName
                            ] =
                                cell.formattedValue ??
                                cell.value ??
                                "";

                        }
                    );


                    rowObject.UserInput =
                        userValue;


                    rowObject.recordType =
                        "existing";


                    records.push(
                        rowObject
                    );

                }
            );


            // --------------------------------------------------
            // New rows
            // --------------------------------------------------

            const newRows =
                document.querySelectorAll(
                    ".new-row"
                );


            newRows.forEach(
                function (newRow) {

                    const rowObject = {};

                    let hasValue = false;


                    currentDataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const input =
                                newRow.querySelector(
                                    `input[data-column-index="${columnIndex}"]`
                                );


                            const value =
                                input
                                    ? input.value.trim()
                                    : "";


                            rowObject[
                                column.fieldName
                            ] = value;


                            if (value !== "") {

                                hasValue =
                                    true;

                            }

                        }
                    );


                    const userInput =
                        newRow.querySelector(
                            ".new-row-user-input"
                        );


                    rowObject.UserInput =
                        userInput
                            ? userInput.value.trim()
                            : "";


                    if (
                        rowObject.UserInput !== ""
                    ) {

                        hasValue =
                            true;

                    }


                    // Ignore completely empty new rows

                    if (!hasValue) {

                        return;

                    }


                    rowObject.recordType =
                        "new";


                    records.push(
                        rowObject
                    );

                }
            );


            return records;

        }


        // --------------------------------------------------
        // Submit All
        // --------------------------------------------------

        submitButton.addEventListener(
            "click",
            async function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                const records =
                    buildPayload();


                if (records.length === 0) {

                    submitStatus.textContent =
                        "No records to submit.";

                    submitStatus.className =
                        "submit-status submit-error";

                    submitStatus.style.display =
                        "block";

                    return;

                }


                // Hide previous message

                submitStatus.style.display =
                    "none";

                submitStatus.className =
                    "submit-status";


                // Build request internally

                const requestPayload = {

                    worksheet:
                        currentWorksheetName,

                    records:
                        records

                };


                status.textContent =
                    "Submitting...";


                submitButton.disabled =
                    true;


                try {

                    // Send data to Google Apps Script

                    const response =
                        await fetch(
                            WRITEBACK_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    /*
                                     * Keep text/plain.
                                     * Do not change to
                                     * application/json.
                                     */

                                    "Content-Type":
                                        "text/plain"

                                },

                                body:
                                    JSON.stringify(
                                        requestPayload
                                    )

                            }
                        );


                    const responseText =
                        await response.text();


                    console.log(
                        "Apps Script response:",
                        responseText
                    );


                    let result = null;


                    try {

                        result =
                            JSON.parse(
                                responseText
                            );

                    }

                    catch (parseError) {

                        console.warn(
                            "Response was not JSON:",
                            responseText
                        );

                    }


                    // --------------------------------------------------
                    // SUCCESS
                    // --------------------------------------------------

                    if (
                        result &&
                        result.status === "success"
                    ) {

                        status.textContent =
                            "";

                        submitStatus.textContent =
                            "Submitted successfully.";

                        submitStatus.className =
                            "submit-status submit-success";

                        submitStatus.style.display =
                            "block";

                    }


                    // --------------------------------------------------
                    // APPS SCRIPT ERROR
                    // --------------------------------------------------

                    else if (
                        result &&
                        result.status === "error"
                    ) {

                        status.textContent =
                            "";

                        submitStatus.textContent =
                            "Submission failed: " +
                            result.message;

                        submitStatus.className =
                            "submit-status submit-error";

                        submitStatus.style.display =
                            "block";

                    }


                    // --------------------------------------------------
                    // HTTP SUCCESS BUT UNKNOWN RESPONSE
                    // --------------------------------------------------

                    else if (
                        response.ok
                    ) {

                        status.textContent =
                            "";

                        submitStatus.textContent =
                            "Submitted successfully.";

                        submitStatus.className =
                            "submit-status submit-success";

                        submitStatus.style.display =
                            "block";

                    }


                    // --------------------------------------------------
                    // HTTP ERROR
                    // --------------------------------------------------

                    else {

                        status.textContent =
                            "";

                        submitStatus.textContent =
                            "Submission failed.";

                        submitStatus.className =
                            "submit-status submit-error";

                        submitStatus.style.display =
                            "block";

                    }

                }

                catch (error) {

                    console.error(
                        "Writeback error:",
                        error
                    );


                    status.textContent =
                        "";

                    submitStatus.textContent =
                        "Unable to submit records.";

                    submitStatus.className =
                        "submit-status submit-error";

                    submitStatus.style.display =
                        "block";

                }

                finally {

                    submitButton.disabled =
                        false;

                }

            }
        );


        // ==================================================
        // SEND EMAIL
        // ==================================================

        // --------------------------------------------------
        // Open email popup
        // --------------------------------------------------

        sendEmailButton.addEventListener(
            "click",
            function () {

                // Reset email status

                emailStatus.style.display =
                    "none";

                emailStatus.className =
                    "email-status";

                emailStatus.textContent =
                    "";


                // Clear recipient

                emailTo.value =
                    "";


                // Clear sender details

                emailName.value =
                    "";

                emailFrom.value =
                    "";


                // Automatically populate subject

                if (currentWorksheetName) {

                    emailSubject.value =
                        "Tableau Feedback - " +
                        currentWorksheetName;

                }

                else {

                    emailSubject.value =
                        "Tableau Feedback";

                }


                // Clear message

                emailMessage.value =
                    "";


                // Enable send button

                confirmEmailButton.disabled =
                    false;


                // Show popup

                emailModal.style.display =
                    "flex";


                // Put cursor in To field

                emailTo.focus();

            }
        );


        // --------------------------------------------------
        // Close email popup
        // --------------------------------------------------

        cancelEmailButton.addEventListener(
            "click",
            function () {

                emailModal.style.display =
                    "none";

            }
        );


        // --------------------------------------------------
        // Close popup when clicking outside
        // --------------------------------------------------

        emailModal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    emailModal
                ) {

                    emailModal.style.display =
                        "none";

                }

            }
        );


        // --------------------------------------------------
        // Send Email
        // --------------------------------------------------

        confirmEmailButton.addEventListener(
            "click",
            async function () {

                const to =
                    emailTo.value.trim();

                const senderName =
                    emailName.value.trim();

                const senderEmail =
                    emailFrom.value.trim();

                const subject =
                    emailSubject.value.trim();

                const message =
                    emailMessage.value.trim();


                // --------------------------------------------------
                // Validate email
                // --------------------------------------------------

                if (!to) {

                    emailStatus.textContent =
                        "Please enter the developer email address.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailTo.focus();

                    return;

                }


                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (
                    !emailPattern.test(to)
                ) {

                    emailStatus.textContent =
                        "Please enter a valid email address.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailTo.focus();

                    return;

                }


                // --------------------------------------------------
                // Validate sender name
                // --------------------------------------------------

                if (!senderName) {

                    emailStatus.textContent =
                        "Please enter your name.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailName.focus();

                    return;

                }


                // --------------------------------------------------
                // Validate sender email
                // --------------------------------------------------

                if (!senderEmail) {

                    emailStatus.textContent =
                        "Please enter your email address.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailFrom.focus();

                    return;

                }


                if (!emailPattern.test(senderEmail)) {

                    emailStatus.textContent =
                        "Please enter a valid email address.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailFrom.focus();

                    return;

                }


                // --------------------------------------------------
                // Validate message
                // --------------------------------------------------

                if (!message) {

                    emailStatus.textContent =
                        "Please enter your feedback/message.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                    emailMessage.focus();

                    return;

                }


                // --------------------------------------------------
                // Build email payload
                // --------------------------------------------------

                const emailPayload = {

                    action:
                        "sendEmail",

                    to:
                        to,

                    senderName:
                        senderName,

                    senderEmail:
                        senderEmail,

                    subject:
                        subject ||
                        "Tableau Feedback",

                    message:
                        message,

                    worksheet:
                        currentWorksheetName

                };


                // --------------------------------------------------
                // Update UI
                // --------------------------------------------------

                emailStatus.style.display =
                    "none";

                emailStatus.className =
                    "email-status";

                confirmEmailButton.disabled =
                    true;

                status.textContent =
                    "Sending email...";


                try {

                    // --------------------------------------------------
                    // IMPORTANT:
                    // This is a separate request from Submit All.
                    //
                    // It does NOT call buildPayload().
                    // It does NOT send worksheet records.
                    // It does NOT write anything to Google Sheet.
                    // --------------------------------------------------

                    const response =
                        await fetch(
                            WRITEBACK_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    /*
                                     * Keep text/plain to match
                                     * the existing Apps Script
                                     * request pattern.
                                     */

                                    "Content-Type":
                                        "text/plain"

                                },

                                body:
                                    JSON.stringify(
                                        emailPayload
                                    )

                            }
                        );


                    const responseText =
                        await response.text();


                    console.log(
                        "Email Apps Script response:",
                        responseText
                    );


                    let result = null;


                    try {

                        result =
                            JSON.parse(
                                responseText
                            );

                    }

                    catch (parseError) {

                        console.warn(
                            "Email response was not JSON:",
                            responseText
                        );

                    }


                    // --------------------------------------------------
                    // EMAIL SUCCESS
                    // --------------------------------------------------

                    if (
                        result &&
                        result.status === "success"
                    ) {

                        status.textContent =
                            "";

                        emailStatus.textContent =
                            "Email sent successfully.";

                        emailStatus.className =
                            "email-status email-success";

                        emailStatus.style.display =
                            "block";


                        // Close popup after short delay

                        setTimeout(
                            function () {

                                emailModal.style.display =
                                    "none";

                            },
                            1200
                        );

                    }


                    // --------------------------------------------------
                    // APPS SCRIPT ERROR
                    // --------------------------------------------------

                    else if (
                        result &&
                        result.status === "error"
                    ) {

                        status.textContent =
                            "";

                        emailStatus.textContent =
                            "Email failed: " +
                            result.message;

                        emailStatus.className =
                            "email-status email-error";

                        emailStatus.style.display =
                            "block";

                    }


                    // --------------------------------------------------
                    // HTTP SUCCESS BUT UNKNOWN RESPONSE
                    // --------------------------------------------------

                    else if (
                        response.ok
                    ) {

                        status.textContent =
                            "";

                        emailStatus.textContent =
                            "Email sent successfully.";

                        emailStatus.className =
                            "email-status email-success";

                        emailStatus.style.display =
                            "block";


                        setTimeout(
                            function () {

                                emailModal.style.display =
                                    "none";

                            },
                            1200
                        );

                    }


                    // --------------------------------------------------
                    // HTTP ERROR
                    // --------------------------------------------------

                    else {

                        status.textContent =
                            "";

                        emailStatus.textContent =
                            "Unable to send email.";

                        emailStatus.className =
                            "email-status email-error";

                        emailStatus.style.display =
                            "block";

                    }

                }

                catch (error) {

                    console.error(
                        "Email error:",
                        error
                    );


                    status.textContent =
                        "";

                    emailStatus.textContent =
                        "Unable to send email.";

                    emailStatus.className =
                        "email-status email-error";

                    emailStatus.style.display =
                        "block";

                }

                finally {

                    confirmEmailButton.disabled =
                        false;

                }

            }
        );


    </script>

</body>

</html>
