<!DOCTYPE html>
<html>

<head>

    <title>Dynamic Tableau Data</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #17233c;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #6f7b8f;
            font-size: 13px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        select {
            width: 100%;
            height: 40px;
            box-sizing: border-box;

            border: 1px solid #ccd2dc;
            border-radius: 5px;

            padding: 8px;
            font-size: 13px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #2c6bed;
        }

        #status {
            margin: 10px 0;
            font-size: 12px;
            color: #6f7b8f;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #d9dde5;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            background: #f4f6f9;
            font-weight: 600;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #d9dde5;
            white-space: nowrap;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #e5e8ed;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .input-cell {
            min-width: 140px;
        }

        .user-input {
            width: 120px;
            height: 32px;
            box-sizing: border-box;

            border: 1px solid #ccd2dc;
            border-radius: 5px;

            padding: 6px 8px;
            font-size: 12px;
        }

        .user-input:focus {
            outline: none;
            border-color: #2c6bed;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .submit-button {
            border: none;
            border-radius: 5px;
            padding: 10px 20px;

            background: #2c6bed;
            color: white;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #1f56c7;
        }

        .submit-button:disabled {
            background: #aab4c5;
            cursor: not-allowed;
        }

        .no-data {
            padding: 20px;
            text-align: center;
            color: #6f7b8f;
            font-size: 13px;
        }

        .payload-container {
            margin-top: 20px;
        }

        .payload-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #payloadOutput {
            width: 100%;
            min-height: 120px;

            box-sizing: border-box;

            border: 1px solid #ccd2dc;
            border-radius: 5px;

            padding: 10px;

            font-family: Consolas, monospace;
            font-size: 11px;

            background: #f8f9fb;

            resize: vertical;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Tableau Worksheet Data
    </h1>

    <div class="subtitle">
        Select a worksheet and enter values for the required rows.
    </div>


    <div class="field">

        <label for="worksheetSelect">
            Select Worksheet
        </label>

        <select id="worksheetSelect">

            <option value="">
                Loading worksheets...
            </option>

        </select>

    </div>


    <div id="status">
        Initializing...
    </div>


    <div
        id="tableContainer"
        class="table-container">
    </div>


    <div
        id="actions"
        class="actions"
        style="display: none;">

        <button
            id="submitButton"
            class="submit-button">

            Submit All

        </button>

    </div>


    <div
        id="payloadContainer"
        class="payload-container"
        style="display: none;">

        <div class="payload-title">
            Payload that will be sent to the API:
        </div>

        <textarea
            id="payloadOutput"
            readonly>
        </textarea>

    </div>

</div>


<script src="./tableau.extensions.1.latest.js"></script>


<script>

    /*
     * Store Tableau worksheets.
     */

    let worksheets = [];


    /*
     * Store the currently loaded
     * Tableau data.
     */

    let currentDataTable = null;


    /*
     * Get HTML elements.
     */

    const worksheetSelect =
        document.getElementById("worksheetSelect");

    const status =
        document.getElementById("status");

    const tableContainer =
        document.getElementById("tableContainer");

    const actions =
        document.getElementById("actions");

    const submitButton =
        document.getElementById("submitButton");

    const payloadContainer =
        document.getElementById("payloadContainer");

    const payloadOutput =
        document.getElementById("payloadOutput");


    /*
     * Initialize Tableau Dialog.
     */

    tableau.extensions.initializeDialogAsync()

        .then(() => {

            console.log(
                "Tableau dialog initialized"
            );


            /*
             * Get worksheets from
             * the current dashboard.
             */

            worksheets =
                tableau.extensions
                    .dashboardContent
                    .dashboard
                    .worksheets;


            console.log(
                "Worksheets:",
                worksheets
            );


            /*
             * Check worksheets.
             */

            if (!worksheets || worksheets.length === 0) {

                status.innerText =
                    "No worksheets found on this dashboard.";

                worksheetSelect.innerHTML =
                    "<option value=''>No worksheets available</option>";

                return;

            }


            /*
             * Populate worksheet dropdown.
             */

            worksheetSelect.innerHTML =
                "<option value=''>Select a worksheet</option>";


            worksheets.forEach(
                (worksheet, index) => {

                    const option =
                        document.createElement("option");

                    option.value = index;

                    option.textContent =
                        worksheet.name;

                    worksheetSelect.appendChild(
                        option
                    );

                }
            );


            status.innerText =
                "Select a worksheet to load its data.";

        })

        .catch((error) => {

            console.error(
                "Dialog initialization error:",
                error
            );

            status.innerText =
                "Unable to connect to Tableau.";

        });


    /*
     * Worksheet selection.
     */

    worksheetSelect.addEventListener(
        "change",
        async () => {

            const selectedIndex =
                worksheetSelect.value;


            if (selectedIndex === "") {

                tableContainer.innerHTML = "";

                actions.style.display =
                    "none";

                payloadContainer.style.display =
                    "none";

                status.innerText =
                    "Select a worksheet to load its data.";

                return;

            }


            const worksheet =
                worksheets[
                    Number(selectedIndex)
                ];


            status.innerText =
                "Loading worksheet data...";


            tableContainer.innerHTML = "";

            actions.style.display =
                "none";

            payloadContainer.style.display =
                "none";


            try {

                console.log(
                    "Selected worksheet:",
                    worksheet.name
                );


                /*
                 * Get summary data reader.
                 */

                const dataTableReader =
                    await worksheet
                        .getSummaryDataReaderAsync();


                /*
                 * Get all pages.
                 */

                const dataTable =
                    await dataTableReader
                        .getAllPagesAsync();


                /*
                 * Release reader.
                 */

                await dataTableReader.releaseAsync();


                /*
                 * Store current data.
                 */

                currentDataTable =
                    dataTable;


                console.log(
                    "Data table:",
                    dataTable
                );


                /*
                 * Display table.
                 */

                displayTable(dataTable);


                status.innerText =
                    "Loaded " +
                    dataTable.data.length +
                    " rows from " +
                    worksheet.name;


                /*
                 * Show Submit button.
                 */

                actions.style.display =
                    "flex";

            }

            catch (error) {

                console.error(
                    "Error reading worksheet data:",
                    error
                );

                status.innerText =
                    "Unable to read worksheet data.";

                tableContainer.innerHTML =
                    "<div class='no-data'>" +
                    "Error loading worksheet data. " +
                    "Check the browser console for details." +
                    "</div>";

            }

        }
    );


    /*
     * Display Tableau data
     * with editable input column.
     */

    function displayTable(dataTable) {

        tableContainer.innerHTML = "";


        /*
         * Validate columns.
         */

        if (
            !dataTable ||
            !dataTable.columns ||
            dataTable.columns.length === 0
        ) {

            tableContainer.innerHTML =
                "<div class='no-data'>" +
                "No columns found." +
                "</div>";

            return;

        }


        /*
         * Validate rows.
         */

        if (
            !dataTable.data ||
            dataTable.data.length === 0
        ) {

            tableContainer.innerHTML =
                "<div class='no-data'>" +
                "No rows found." +
                "</div>";

            return;

        }


        /*
         * Create table.
         */

        const table =
            document.createElement("table");


        /*
         * Create header.
         */

        const thead =
            document.createElement("thead");

        const headerRow =
            document.createElement("tr");


        /*
         * Add Tableau columns.
         */

        dataTable.columns.forEach(
            (column) => {

                const th =
                    document.createElement("th");

                th.textContent =
                    column.fieldName;

                headerRow.appendChild(th);

            }
        );


        /*
         * Add User Input column.
         */

        const inputHeader =
            document.createElement("th");

        inputHeader.textContent =
            "User Input";

        headerRow.appendChild(
            inputHeader
        );


        thead.appendChild(
            headerRow
        );

        table.appendChild(
            thead
        );


        /*
         * Create body.
         */

        const tbody =
            document.createElement("tbody");


        /*
         * Create one HTML row
         * for every Tableau row.
         */

        dataTable.data.forEach(
            (row, rowIndex) => {

                const tr =
                    document.createElement("tr");


                /*
                 * Add Tableau cells.
                 */

                row.forEach(
                    (cell) => {

                        const td =
                            document.createElement("td");


                        if (
                            cell &&
                            cell.formattedValue !== undefined
                        ) {

                            td.textContent =
                                cell.formattedValue;

                        }

                        else if (
                            cell &&
                            cell.value !== undefined
                        ) {

                            td.textContent =
                                cell.value;

                        }

                        else {

                            td.textContent = "";

                        }


                        tr.appendChild(td);

                    }
                );


                /*
                 * Create input cell.
                 */

                const inputCell =
                    document.createElement("td");

                inputCell.className =
                    "input-cell";


                const input =
                    document.createElement("input");

                input.type = "text";

                input.className =
                    "user-input";

                input.placeholder =
                    "Enter value";


                /*
                 * Store Tableau row index.
                 */

                input.dataset.rowIndex =
                    rowIndex;


                inputCell.appendChild(
                    input
                );


                tr.appendChild(
                    inputCell
                );


                tbody.appendChild(
                    tr
                );

            }
        );


        table.appendChild(
            tbody
        );


        tableContainer.appendChild(
            table
        );

    }


    /*
     * Submit All
     */

    submitButton.addEventListener(
        "click",
        () => {

            /*
             * Find all input boxes.
             */

            const inputs =
                document.querySelectorAll(
                    ".user-input"
                );


            /*
             * Array that will contain
             * only changed/entered rows.
             */

            const changedRows = [];


            /*
             * Check every input.
             */

            inputs.forEach(
                (input) => {

                    const userValue =
                        input.value.trim();


                    /*
                     * Ignore empty inputs.
                     */

                    if (!userValue) {

                        return;

                    }


                    const rowIndex =
                        Number(
                            input.dataset.rowIndex
                        );


                    const tableauRow =
                        currentDataTable.data[
                            rowIndex
                        ];


                    /*
                     * Build an object containing
                     * the original Tableau values.
                     */

                    const rowObject = {};


                    currentDataTable.columns.forEach(
                        (column, columnIndex) => {

                            const cell =
                                tableauRow[
                                    columnIndex
                                ];


                            if (
                                cell &&
                                cell.formattedValue !== undefined
                            ) {

                                rowObject[
                                    column.fieldName
                                ] =
                                    cell.formattedValue;

                            }

                            else if (
                                cell &&
                                cell.value !== undefined
                            ) {

                                rowObject[
                                    column.fieldName
                                ] =
                                    cell.value;

                            }

                            else {

                                rowObject[
                                    column.fieldName
                                ] = "";

                            }

                        }
                    );


                    /*
                     * Add the user's value.
                     */

                    rowObject.UserInput =
                        userValue;


                    /*
                     * Add this row to
                     * changedRows.
                     */

                    changedRows.push(
                        rowObject
                    );

                }
            );


            /*
             * Check whether anything
             * was entered.
             */

            if (changedRows.length === 0) {

                status.innerText =
                    "Please enter a value in at least one row.";

                payloadContainer.style.display =
                    "none";

                return;

            }


            /*
             * Convert the array to JSON.
             */

            const payload =
                JSON.stringify(
                    changedRows,
                    null,
                    2
                );


            /*
             * Display payload for testing.
             */

            payloadOutput.value =
                payload;


            payloadContainer.style.display =
                "block";


            status.innerText =
                changedRows.length +
                " row(s) ready to submit.";

            console.log(
                "Payload:",
                changedRows
            );

        }
    );

</script>

</body>

</html>
