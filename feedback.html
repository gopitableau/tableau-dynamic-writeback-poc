<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dynamic Tableau Writeback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        h2 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        select {
            padding: 8px;
            min-width: 250px;
            margin-bottom: 15px;
        }

        .status {
            margin: 10px 0;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ddd;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .user-input,
        .new-row-input {
            width: 120px;
            padding: 6px;
            box-sizing: border-box;
        }

        .new-row td {
            background-color: #fffdf2;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 9px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-button {
            background-color: #198754;
            color: white;
        }

        .submit-button {
            background-color: #0d6efd;
            color: white;
        }

        .remove-button {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        button:hover {
            opacity: 0.9;
        }

        .payload-container {
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 250px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Tableau Worksheet Data</h2>

    <div class="subtitle">
        Select a worksheet to view its data, edit values, or add new rows.
    </div>

    <label for="worksheetSelect">
        <strong>Select Worksheet:</strong>
    </label>

    <br>

    <select id="worksheetSelect">
        <option value="">-- Select Worksheet --</option>
    </select>

    <div id="status" class="status"></div>

    <div class="table-wrapper">
        <div id="tableContainer"></div>
    </div>

    <div id="actions" class="actions" style="display:none;">

        <button
            id="addRowButton"
            class="add-button">
            + Add Row
        </button>

        <button
            id="submitButton"
            class="submit-button">
            Submit All
        </button>

    </div>

    <div
        id="payloadContainer"
        class="payload-container"
        style="display:none;">

        <h3>Generated Payload</h3>

        <textarea
            id="payloadOutput"
            readonly>
        </textarea>

    </div>


    <script src="tableau.extensions.1.latest.js"></script>

    <script>

        // -----------------------------------------
        // Global variables
        // -----------------------------------------

        let worksheets = [];

        let currentDataTable = null;

        let newRowCounter = 0;


        // -----------------------------------------
        // DOM elements
        // -----------------------------------------

        const worksheetSelect =
            document.getElementById("worksheetSelect");

        const status =
            document.getElementById("status");

        const tableContainer =
            document.getElementById("tableContainer");

        const actions =
            document.getElementById("actions");

        const addRowButton =
            document.getElementById("addRowButton");

        const submitButton =
            document.getElementById("submitButton");

        const payloadContainer =
            document.getElementById("payloadContainer");

        const payloadOutput =
            document.getElementById("payloadOutput");


        // -----------------------------------------
        // Initialize Tableau Extension
        // -----------------------------------------

        tableau.extensions.initializeDialogAsync()
            .then(function () {

                status.textContent =
                    "Extension initialized successfully.";

                loadWorksheets();

            })
            .catch(function (error) {

                status.textContent =
                    "Initialization failed: " + error.message;

                console.error(error);

            });


        // -----------------------------------------
        // Load worksheets from current dashboard
        // -----------------------------------------

        async function loadWorksheets() {

            try {

                const dashboard =
                    tableau.extensions.dashboardContent.dashboard;

                worksheets =
                    dashboard.worksheets;

                worksheetSelect.innerHTML =
                    '<option value="">-- Select Worksheet --</option>';

                worksheets.forEach(function (worksheet, index) {

                    const option =
                        document.createElement("option");

                    option.value = index;

                    option.textContent =
                        worksheet.name;

                    worksheetSelect.appendChild(option);

                });

                status.textContent =
                    worksheets.length +
                    " worksheet(s) found on this dashboard.";

            }
            catch (error) {

                status.textContent =
                    "Unable to load worksheets: " +
                    error.message;

                console.error(error);

            }

        }


        // -----------------------------------------
        // Worksheet selection
        // -----------------------------------------

        worksheetSelect.addEventListener(
            "change",
            async function () {

                const selectedIndex =
                    worksheetSelect.value;

                if (selectedIndex === "") {

                    tableContainer.innerHTML = "";

                    actions.style.display = "none";

                    payloadContainer.style.display = "none";

                    currentDataTable = null;

                    return;
                }


                try {

                    status.textContent =
                        "Loading worksheet data...";


                    // Clear previous new-row counter
                    newRowCounter = 0;


                    const worksheet =
                        worksheets[selectedIndex];


                    // Get summary data reader
                    const dataTableReader =
                        await worksheet.getSummaryDataReaderAsync();


                    // Get all pages
                    const dataTable =
                        await dataTableReader.getAllPagesAsync();


                    // Release reader
                    await dataTableReader.releaseAsync();


                    currentDataTable =
                        dataTable;


                    // Display data
                    displayTable(dataTable);


                    actions.style.display = "flex";

                    payloadContainer.style.display = "none";


                    status.textContent =
                        dataTable.data.length +
                        " Tableau row(s) loaded.";

                }
                catch (error) {

                    status.textContent =
                        "Unable to load worksheet data: " +
                        error.message;

                    console.error(error);

                }

            }
        );


        // -----------------------------------------
        // Display Tableau data
        // -----------------------------------------

        function displayTable(dataTable) {

            tableContainer.innerHTML = "";


            const table =
                document.createElement("table");


            // -------------------------------------
            // Header
            // -------------------------------------

            const thead =
                document.createElement("thead");

            const headerRow =
                document.createElement("tr");


            dataTable.columns.forEach(
                function (column) {

                    const th =
                        document.createElement("th");

                    th.textContent =
                        column.fieldName;

                    headerRow.appendChild(th);

                }
            );


            // User Input column
            const userInputHeader =
                document.createElement("th");

            userInputHeader.textContent =
                "User Input";

            headerRow.appendChild(userInputHeader);


            // Action column
            const actionHeader =
                document.createElement("th");

            actionHeader.textContent =
                "Action";

            headerRow.appendChild(actionHeader);


            thead.appendChild(headerRow);

            table.appendChild(thead);


            // -------------------------------------
            // Body
            // -------------------------------------

            const tbody =
                document.createElement("tbody");


            dataTable.data.forEach(
                function (row, rowIndex) {

                    const tr =
                        document.createElement("tr");


                    // Tableau columns
                    dataTable.columns.forEach(
                        function (column, columnIndex) {

                            const td =
                                document.createElement("td");


                            const cell =
                                row[columnIndex];


                            td.textContent =
                                cell.formattedValue ??
                                cell.value ??
                                "";


                            tr.appendChild(td);

                        }
                    );


                    // User Input
                    const userInputTd =
                        document.createElement("td");


                    const userInput =
                        document.createElement("input");

                    userInput.type = "text";

                    userInput.className =
                        "user-input";

                    userInput.placeholder =
                        "Enter value";

                    userInput.dataset.rowIndex =
                        rowIndex;


                    userInputTd.appendChild(
                        userInput
                    );

                    tr.appendChild(
                        userInputTd
                    );


                    // Action column
                    const actionTd =
                        document.createElement("td");

                    actionTd.textContent =
                        "Existing";

                    tr.appendChild(
                        actionTd
                    );


                    tbody.appendChild(tr);

                }
            );


            table.appendChild(tbody);

            tableContainer.appendChild(table);

        }


        // -----------------------------------------
        // Add New Row
        // -----------------------------------------

        addRowButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Please select a worksheet first.";

                    return;

                }


                const table =
                    tableContainer.querySelector("table");

                const tbody =
                    table.querySelector("tbody");


                // Create new table row
                const tr =
                    document.createElement("tr");


                tr.className =
                    "new-row";


                tr.dataset.newRowId =
                    newRowCounter;


                newRowCounter++;


                // ---------------------------------
                // Create input for every Tableau
                // column
                // ---------------------------------

                currentDataTable.columns.forEach(
                    function (column, columnIndex) {

                        const td =
                            document.createElement("td");


                        const input =
                            document.createElement("input");


                        input.type = "text";

                        input.className =
                            "new-row-input";

                        input.placeholder =
                            column.fieldName;


                        input.dataset.columnIndex =
                            columnIndex;


                        td.appendChild(input);

                        tr.appendChild(td);

                    }
                );


                // ---------------------------------
                // User Input column
                // ---------------------------------

                const userInputTd =
                    document.createElement("td");


                const userInput =
                    document.createElement("input");


                userInput.type = "text";

                userInput.className =
                    "new-row-input";

                userInput.placeholder =
                    "Enter value";


                userInputTd.appendChild(
                    userInput
                );

                tr.appendChild(
                    userInputTd
                );


                // ---------------------------------
                // Remove button
                // ---------------------------------

                const actionTd =
                    document.createElement("td");


                const removeButton =
                    document.createElement("button");


                removeButton.textContent =
                    "Remove";

                removeButton.className =
                    "remove-button";


                removeButton.addEventListener(
                    "click",
                    function () {

                        tr.remove();

                    }
                );


                actionTd.appendChild(
                    removeButton
                );


                tr.appendChild(actionTd);


                // Add row to table
                tbody.appendChild(tr);


                status.textContent =
                    "New row added. You can enter the values.";

            }
        );


        // -----------------------------------------
        // Submit All
        // -----------------------------------------

        submitButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Please select a worksheet first.";

                    return;

                }


                const payload = [];


                // =================================
                // EXISTING TABLEAU ROWS
                // =================================

                const existingInputs =
                    document.querySelectorAll(
                        ".user-input"
                    );


                existingInputs.forEach(
                    function (input) {

                        const userValue =
                            input.value.trim();


                        // Ignore unchanged/empty rows
                        if (userValue === "") {
                            return;
                        }


                        const rowIndex =
                            Number(
                                input.dataset.rowIndex
                            );


                        const tableauRow =
                            currentDataTable.data[rowIndex];


                        const rowObject = {};


                        currentDataTable.columns.forEach(
                            function (column, columnIndex) {

                                const cell =
                                    tableauRow[columnIndex];


                                rowObject[
                                    column.fieldName
                                ] =
                                    cell.formattedValue ??
                                    cell.value ??
                                    "";

                            }
                        );


                        rowObject.UserInput =
                            userValue;


                        rowObject.recordType =
                            "existing";


                        payload.push(rowObject);

                    }
                );


                // =================================
                // NEW ROWS
                // =================================

                const newRows =
                    document.querySelectorAll(
                        ".new-row"
                    );


                newRows.forEach(
                    function (newRow) {

                        const rowObject = {};

                        let hasValue = false;


                        // Tableau columns
                        currentDataTable.columns.forEach(
                            function (column, columnIndex) {

                                const input =
                                    newRow.querySelector(
                                        `input[data-column-index="${columnIndex}"]`
                                    );


                                const value =
                                    input.value.trim();


                                rowObject[
                                    column.fieldName
                                ] = value;


                                if (value !== "") {
                                    hasValue = true;
                                }

                            }
                        );


                        // User Input
                        const userInput =
                            newRow.querySelector(
                                ".new-row-input:last-of-type"
                            );


                        rowObject.UserInput =
                            userInput
                                ? userInput.value.trim()
                                : "";


                        if (
                            rowObject.UserInput !== ""
                        ) {
                            hasValue = true;
                        }


                        // Ignore completely empty
                        // new rows
                        if (!hasValue) {
                            return;
                        }


                        rowObject.recordType =
                            "new";


                        payload.push(rowObject);

                    }
                );


                // =================================
                // Display combined payload
                // =================================

                payloadOutput.value =
                    JSON.stringify(
                        payload,
                        null,
                        2
                    );


                payloadContainer.style.display =
                    "block";


                status.textContent =
                    payload.length +
                    " record(s) ready for submission.";

            }
        );

    </script>

</body>
</html>
