<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Dynamic Tableau Writeback</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        h2 {
            margin-bottom: 15px;
        }

        select {
            padding: 8px;
            min-width: 250px;
            margin-bottom: 10px;
        }

        .status {
            margin: 5px 0 10px 0;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ddd;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .user-input,
        .new-row-input {
            width: 120px;
            padding: 6px;
            box-sizing: border-box;
        }

        /*
         * Highlight newly added rows
         */
        .new-row td {
            background-color: #fffdf2;
        }

        .actions {
            margin-top: 15px;

            display: flex;

            gap: 10px;
        }

        button {
            padding: 9px 16px;

            border: none;

            border-radius: 4px;

            cursor: pointer;

            font-size: 14px;
        }

        .add-button {
            background-color: #198754;

            color: white;
        }

        .submit-button {
            background-color: #0d6efd;

            color: white;
        }

        .remove-button {
            background-color: #dc3545;

            color: white;

            padding: 5px 10px;

            font-size: 12px;
        }

        button:hover {
            opacity: 0.9;
        }

        .payload-container {
            margin-top: 20px;
        }

        textarea {
            width: 100%;

            height: 250px;

            box-sizing: border-box;

            font-family: monospace;

            font-size: 12px;
        }

    </style>
</head>


<body>

    <h2>Tableau Worksheet Data</h2>


    <!-- Worksheet selection -->

    <label for="worksheetSelect">

        <strong>Select Worksheet:</strong>

    </label>

    <br>


    <select id="worksheetSelect">

        <option value="">
            -- Select Worksheet --
        </option>

    </select>


    <!-- Simple status -->

    <div
        id="status"
        class="status">
    </div>


    <!-- Tableau data table -->

    <div class="table-wrapper">

        <div id="tableContainer"></div>

    </div>


    <!-- Buttons -->

    <div
        id="actions"
        class="actions"
        style="display:none;">

        <button
            id="addRowButton"
            class="add-button">

            + Add Row

        </button>


        <button
            id="submitButton"
            class="submit-button">

            Submit All

        </button>

    </div>


    <!-- Payload display -->

    <div
        id="payloadContainer"
        class="payload-container"
        style="display:none;">

        <h3>Generated Payload</h3>


        <textarea
            id="payloadOutput"
            readonly>
        </textarea>

    </div>


    <!-- Tableau Extensions API -->

    <script src="tableau.extensions.1.latest.js"></script>


    <script>

        // =====================================================
        // Global variables
        // =====================================================

        let worksheets = [];

        let currentDataTable = null;

        let newRowCounter = 0;


        // =====================================================
        // DOM elements
        // =====================================================

        const worksheetSelect =
            document.getElementById(
                "worksheetSelect"
            );


        const status =
            document.getElementById(
                "status"
            );


        const tableContainer =
            document.getElementById(
                "tableContainer"
            );


        const actions =
            document.getElementById(
                "actions"
            );


        const addRowButton =
            document.getElementById(
                "addRowButton"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const payloadContainer =
            document.getElementById(
                "payloadContainer"
            );


        const payloadOutput =
            document.getElementById(
                "payloadOutput"
            );


        // =====================================================
        // Initialize Tableau Extension
        // =====================================================

        tableau.extensions
            .initializeDialogAsync()

            .then(function () {

                status.textContent =
                    "Ready";

                loadWorksheets();

            })

            .catch(function (error) {

                status.textContent =
                    "Initialization failed";

                console.error(error);

            });


        // =====================================================
        // Load worksheets from current dashboard
        // =====================================================

        async function loadWorksheets() {

            try {

                const dashboard =
                    tableau.extensions
                        .dashboardContent
                        .dashboard;


                worksheets =
                    dashboard.worksheets;


                worksheetSelect.innerHTML =
                    '<option value="">-- Select Worksheet --</option>';


                worksheets.forEach(
                    function (worksheet, index) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            index;


                        option.textContent =
                            worksheet.name;


                        worksheetSelect.appendChild(
                            option
                        );

                    }
                );


                status.textContent =
                    "Ready";

            }

            catch (error) {

                status.textContent =
                    "Unable to load worksheets";

                console.error(error);

            }

        }


        // =====================================================
        // Worksheet selection
        // =====================================================

        worksheetSelect.addEventListener(
            "change",
            async function () {

                const selectedIndex =
                    worksheetSelect.value;


                // Nothing selected
                if (selectedIndex === "") {

                    tableContainer.innerHTML =
                        "";

                    actions.style.display =
                        "none";

                    payloadContainer.style.display =
                        "none";

                    currentDataTable =
                        null;

                    return;
                }


                try {

                    status.textContent =
                        "Loading...";


                    /*
                     * Reset new-row counter.
                     *
                     * displayTable() also rebuilds
                     * the table, so old new rows
                     * disappear when another worksheet
                     * is selected.
                     */

                    newRowCounter = 0;


                    const worksheet =
                        worksheets[
                            selectedIndex
                        ];


                    // -----------------------------------------
                    // Get summary data reader
                    // -----------------------------------------

                    const dataTableReader =
                        await worksheet
                            .getSummaryDataReaderAsync();


                    // -----------------------------------------
                    // Get all pages
                    // -----------------------------------------

                    const dataTable =
                        await dataTableReader
                            .getAllPagesAsync();


                    // -----------------------------------------
                    // Release reader
                    // -----------------------------------------

                    await dataTableReader
                        .releaseAsync();


                    // Store current data
                    currentDataTable =
                        dataTable;


                    // Display table
                    displayTable(
                        dataTable
                    );


                    // Show buttons
                    actions.style.display =
                        "flex";


                    // Hide old payload
                    payloadContainer.style.display =
                        "none";


                    status.textContent =
                        "Loaded";

                }

                catch (error) {

                    status.textContent =
                        "Unable to load worksheet data";

                    console.error(error);

                }

            }
        );


        // =====================================================
        // Display Tableau data
        // =====================================================

        function displayTable(
            dataTable
        ) {

            // Clear old table
            tableContainer.innerHTML =
                "";


            // Create table
            const table =
                document.createElement(
                    "table"
                );


            // =================================================
            // Header
            // =================================================

            const thead =
                document.createElement(
                    "thead"
                );


            const headerRow =
                document.createElement(
                    "tr"
                );


            // -----------------------------------------
            // Tableau columns
            // -----------------------------------------

            dataTable.columns.forEach(
                function (column) {

                    const th =
                        document.createElement(
                            "th"
                        );


                    th.textContent =
                        column.fieldName;


                    headerRow.appendChild(
                        th
                    );

                }
            );


            // -----------------------------------------
            // User Input column
            // -----------------------------------------

            const userInputHeader =
                document.createElement(
                    "th"
                );


            userInputHeader.textContent =
                "User Input";


            headerRow.appendChild(
                userInputHeader
            );


            thead.appendChild(
                headerRow
            );


            table.appendChild(
                thead
            );


            // =================================================
            // Body
            // =================================================

            const tbody =
                document.createElement(
                    "tbody"
                );


            dataTable.data.forEach(
                function (
                    row,
                    rowIndex
                ) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    // -----------------------------------------
                    // Tableau columns
                    // -----------------------------------------

                    dataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const td =
                                document.createElement(
                                    "td"
                                );


                            const cell =
                                row[columnIndex];


                            td.textContent =
                                cell.formattedValue ??
                                cell.value ??
                                "";


                            tr.appendChild(
                                td
                            );

                        }
                    );


                    // -----------------------------------------
                    // User Input
                    // -----------------------------------------

                    const userInputTd =
                        document.createElement(
                            "td"
                        );


                    const userInput =
                        document.createElement(
                            "input"
                        );


                    userInput.type =
                        "text";


                    userInput.className =
                        "user-input";


                    userInput.placeholder =
                        "Enter value";


                    /*
                     * Remember which Tableau row
                     * this input belongs to.
                     */

                    userInput.dataset.rowIndex =
                        rowIndex;


                    userInputTd.appendChild(
                        userInput
                    );


                    tr.appendChild(
                        userInputTd
                    );


                    tbody.appendChild(
                        tr
                    );

                }
            );


            table.appendChild(
                tbody
            );


            tableContainer.appendChild(
                table
            );

        }


        // =====================================================
        // Add New Row
        // =====================================================

        addRowButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                // Find current table
                const table =
                    tableContainer.querySelector(
                        "table"
                    );


                const tbody =
                    table.querySelector(
                        "tbody"
                    );


                // Create new row
                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.className =
                    "new-row";


                tr.dataset.newRowId =
                    newRowCounter;


                newRowCounter++;


                // =================================================
                // Create input for every Tableau column
                // =================================================

                currentDataTable.columns.forEach(
                    function (
                        column,
                        columnIndex
                    ) {

                        const td =
                            document.createElement(
                                "td"
                            );


                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "text";


                        input.className =
                            "new-row-input";


                        input.placeholder =
                            column.fieldName;


                        input.dataset.columnIndex =
                            columnIndex;


                        td.appendChild(
                            input
                        );


                        tr.appendChild(
                            td
                        );

                    }
                );


                // =================================================
                // User Input for new row
                // =================================================

                const userInputTd =
                    document.createElement(
                        "td"
                    );


                const userInput =
                    document.createElement(
                        "input"
                    );


                userInput.type =
                    "text";


                userInput.className =
                    "new-row-user-input";


                userInput.placeholder =
                    "Enter value";


                userInputTd.appendChild(
                    userInput
                );


                tr.appendChild(
                    userInputTd
                );


                // =================================================
                // Remove button
                // =================================================

                const actionTd =
                    document.createElement(
                        "td"
                    );


                const removeButton =
                    document.createElement(
                        "button"
                    );


                removeButton.textContent =
                    "Remove";


                removeButton.className =
                    "remove-button";


                removeButton.addEventListener(
                    "click",
                    function () {

                        tr.remove();

                    }
                );


                actionTd.appendChild(
                    removeButton
                );


                tr.appendChild(
                    actionTd
                );


                // Add new row to table
                tbody.appendChild(
                    tr
                );


                status.textContent =
                    "New row added";

            }
        );


        // =====================================================
        // Submit All
        // =====================================================

        submitButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                const payload = [];


                // =================================================
                // EXISTING TABLEAU ROWS
                // =================================================

                const existingInputs =
                    document.querySelectorAll(
                        ".user-input"
                    );


                existingInputs.forEach(
                    function (input) {

                        const userValue =
                            input.value.trim();


                        /*
                         * If the user didn't enter
                         * anything, ignore this row.
                         */

                        if (userValue === "") {

                            return;

                        }


                        const rowIndex =
                            Number(
                                input.dataset.rowIndex
                            );


                        const tableauRow =
                            currentDataTable
                                .data[rowIndex];


                        const rowObject =
                            {};


                        // -----------------------------------------
                        // Add Tableau fields
                        // -----------------------------------------

                        currentDataTable.columns.forEach(
                            function (
                                column,
                                columnIndex
                            ) {

                                const cell =
                                    tableauRow[
                                        columnIndex
                                    ];


                                rowObject[
                                    column.fieldName
                                ] =
                                    cell.formattedValue ??
                                    cell.value ??
                                    "";

                            }
                        );


                        // -----------------------------------------
                        // Add user value
                        // -----------------------------------------

                        rowObject.UserInput =
                            userValue;


                        // -----------------------------------------
                        // Identify record type
                        // -----------------------------------------

                        rowObject.recordType =
                            "existing";


                        // Add to payload
                        payload.push(
                            rowObject
                        );

                    }
                );


                // =================================================
                // NEW ROWS
                // =================================================

                const newRows =
                    document.querySelectorAll(
                        ".new-row"
                    );


                newRows.forEach(
                    function (newRow) {

                        const rowObject =
                            {};


                        let hasValue =
                            false;


                        // -----------------------------------------
                        // Tableau columns
                        // -----------------------------------------

                        currentDataTable.columns.forEach(
                            function (
                                column,
                                columnIndex
                            ) {

                                const input =
                                    newRow.querySelector(
                                        `input[data-column-index="${columnIndex}"]`
                                    );


                                const value =
                                    input
                                        ? input.value.trim()
                                        : "";


                                rowObject[
                                    column.fieldName
                                ] =
                                    value;


                                if (value !== "") {

                                    hasValue =
                                        true;

                                }

                            }
                        );


                        // -----------------------------------------
                        // User Input
                        // -----------------------------------------

                        const userInput =
                            newRow.querySelector(
                                ".new-row-user-input"
                            );


                        rowObject.UserInput =
                            userInput
                                ? userInput.value.trim()
                                : "";


                        if (
                            rowObject.UserInput !== ""
                        ) {

                            hasValue =
                                true;

                        }


                        /*
                         * Completely empty new rows
                         * are ignored.
                         */

                        if (!hasValue) {

                            return;

                        }


                        // Identify as new record
                        rowObject.recordType =
                            "new";


                        // Add to payload
                        payload.push(
                            rowObject
                        );

                    }
                );


                // =================================================
                // Display payload
                // =================================================

                payloadOutput.value =
                    JSON.stringify(
                        payload,
                        null,
                        2
                    );


                payloadContainer.style.display =
                    "block";


                status.textContent =
                    payload.length +
                    " record(s) ready";

            }
        );

    </script>

</body>
</html>
