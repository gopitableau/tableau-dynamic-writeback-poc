<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Dynamic Tableau Writeback</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 12px;
            background-color: #f8f9fa;
            font-size: 12px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        select {
            padding: 5px;
            min-width: 200px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .status {
            margin: 4px 0 8px 0;
            font-weight: bold;
            font-size: 11px;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ddd;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 700px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 5px 7px;
            text-align: left;
            white-space: nowrap;
            font-size: 11px;
        }

        th {
            background-color: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .user-input,
        .new-row-input {
            width: 100px;
            padding: 4px;
            box-sizing: border-box;
            font-size: 11px;
        }

        .new-row-user-input {
            width: 100px;
            padding: 4px;
            box-sizing: border-box;
            font-size: 11px;
        }

        .new-row td {
            background-color: #fffdf2;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 11px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-button {
            background-color: #198754;
            color: white;
        }

        .submit-button {
            background-color: #0d6efd;
            color: white;
        }

        .remove-button {
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            font-size: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .payload-container {
            margin-top: 15px;
        }

        .payload-container h3 {
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 200px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 10px;
        }

    </style>

</head>


<body>

    <h2>Tableau Worksheet Data</h2>


    <label for="worksheetSelect">
        <strong>Select Worksheet:</strong>
    </label>

    <br>

    <select id="worksheetSelect">

        <option value="">
            -- Select Worksheet --
        </option>

    </select>


    <div id="status" class="status"></div>


    <div class="table-wrapper">

        <div id="tableContainer"></div>

    </div>


    <div id="actions"
         class="actions"
         style="display:none;">

        <button
            id="addRowButton"
            class="add-button">

            + Add Row

        </button>


        <button
            id="submitButton"
            class="submit-button">

            Submit All

        </button>

    </div>


    <div id="payloadContainer"
         class="payload-container"
         style="display:none;">

        <h3>Generated Payload</h3>

        <textarea
            id="payloadOutput"
            readonly>
        </textarea>

    </div>


    <script src="tableau.extensions.1.latest.js"></script>


    <script>

        /*
         * Google Apps Script Web App
         *
         * This is the /exec URL of the
         * Tableau Dynamic Writeback POC.
         */

        const WRITEBACK_URL =
            "https://script.google.com/macros/s/AKfycbwNup0y3TImWTO6RR5gTaFBiziHHbwahKIvNSPBhPEUhlRiDBIgzEW4KYTePFyNBNs84A/exec";


        let worksheets = [];

        let currentDataTable = null;

        let currentWorksheetName = "";

        let newRowCounter = 0;


        const worksheetSelect =
            document.getElementById(
                "worksheetSelect"
            );


        const status =
            document.getElementById(
                "status"
            );


        const tableContainer =
            document.getElementById(
                "tableContainer"
            );


        const actions =
            document.getElementById(
                "actions"
            );


        const addRowButton =
            document.getElementById(
                "addRowButton"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const payloadContainer =
            document.getElementById(
                "payloadContainer"
            );


        const payloadOutput =
            document.getElementById(
                "payloadOutput"
            );



        // --------------------------------------------------
        // Initialize Tableau Extension
        // --------------------------------------------------

        tableau.extensions.initializeDialogAsync()

            .then(function () {

                status.textContent =
                    "Ready";

                loadWorksheets();

            })

            .catch(function (error) {

                status.textContent =
                    "Initialization failed";

                console.error(error);

            });



        // --------------------------------------------------
        // Load worksheets from current dashboard
        // --------------------------------------------------

        async function loadWorksheets() {

            try {

                const dashboard =
                    tableau.extensions
                        .dashboardContent
                        .dashboard;


                worksheets =
                    dashboard.worksheets;


                worksheetSelect.innerHTML =
                    '<option value="">-- Select Worksheet --</option>';


                worksheets.forEach(
                    function (worksheet, index) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            index;


                        option.textContent =
                            worksheet.name;


                        worksheetSelect.appendChild(
                            option
                        );

                    }
                );


                status.textContent =
                    "Ready";

            }

            catch (error) {

                status.textContent =
                    "Unable to load worksheets";

                console.error(error);

            }

        }



        // --------------------------------------------------
        // Worksheet selection
        // --------------------------------------------------

        worksheetSelect.addEventListener(
            "change",
            async function () {

                const selectedIndex =
                    worksheetSelect.value;


                if (selectedIndex === "") {

                    tableContainer.innerHTML =
                        "";

                    actions.style.display =
                        "none";

                    payloadContainer.style.display =
                        "none";

                    currentDataTable =
                        null;

                    currentWorksheetName =
                        "";

                    return;

                }


                try {

                    status.textContent =
                        "Loading...";


                    newRowCounter =
                        0;


                    const worksheet =
                        worksheets[
                            selectedIndex
                        ];


                    currentWorksheetName =
                        worksheet.name;


                    const dataTableReader =
                        await worksheet
                            .getSummaryDataReaderAsync();


                    const dataTable =
                        await dataTableReader
                            .getAllPagesAsync();


                    await dataTableReader
                        .releaseAsync();


                    currentDataTable =
                        dataTable;


                    displayTable(
                        dataTable
                    );


                    actions.style.display =
                        "flex";


                    payloadContainer.style.display =
                        "none";


                    status.textContent =
                        "Loaded";

                }

                catch (error) {

                    status.textContent =
                        "Unable to load worksheet data";

                    console.error(error);

                }

            }

        );



        // --------------------------------------------------
        // Display Tableau data
        // --------------------------------------------------

        function displayTable(dataTable) {

            tableContainer.innerHTML =
                "";


            const table =
                document.createElement(
                    "table"
                );


            const thead =
                document.createElement(
                    "thead"
                );


            const headerRow =
                document.createElement(
                    "tr"
                );


            dataTable.columns.forEach(
                function (column) {

                    const th =
                        document.createElement(
                            "th"
                        );


                    th.textContent =
                        column.fieldName;


                    headerRow.appendChild(
                        th
                    );

                }
            );


            const userInputHeader =
                document.createElement(
                    "th"
                );


            userInputHeader.textContent =
                "User Input";


            headerRow.appendChild(
                userInputHeader
            );


            const actionHeader =
                document.createElement(
                    "th"
                );


            actionHeader.textContent =
                "";


            headerRow.appendChild(
                actionHeader
            );


            thead.appendChild(
                headerRow
            );


            table.appendChild(
                thead
            );


            const tbody =
                document.createElement(
                    "tbody"
                );


            dataTable.data.forEach(
                function (row, rowIndex) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    dataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const td =
                                document.createElement(
                                    "td"
                                );


                            const cell =
                                row[
                                    columnIndex
                                ];


                            td.textContent =
                                cell.formattedValue ??
                                cell.value ??
                                "";


                            tr.appendChild(
                                td
                            );

                        }
                    );


                    const userInputTd =
                        document.createElement(
                            "td"
                        );


                    const userInput =
                        document.createElement(
                            "input"
                        );


                    userInput.type =
                        "text";


                    userInput.className =
                        "user-input";


                    userInput.placeholder =
                        "Enter value";


                    userInput.dataset.rowIndex =
                        rowIndex;


                    userInputTd.appendChild(
                        userInput
                    );


                    tr.appendChild(
                        userInputTd
                    );


                    const actionTd =
                        document.createElement(
                            "td"
                        );


                    tr.appendChild(
                        actionTd
                    );


                    tbody.appendChild(
                        tr
                    );

                }
            );


            table.appendChild(
                tbody
            );


            tableContainer.appendChild(
                table
            );

        }



        // --------------------------------------------------
        // Add new row
        // --------------------------------------------------

        addRowButton.addEventListener(
            "click",
            function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                const table =
                    tableContainer
                        .querySelector(
                            "table"
                        );


                const tbody =
                    table.querySelector(
                        "tbody"
                    );


                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.className =
                    "new-row";


                tr.dataset.newRowId =
                    newRowCounter;


                newRowCounter++;


                currentDataTable.columns.forEach(
                    function (
                        column,
                        columnIndex
                    ) {

                        const td =
                            document.createElement(
                                "td"
                            );


                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "text";


                        input.className =
                            "new-row-input";


                        input.placeholder =
                            column.fieldName;


                        input.dataset.columnIndex =
                            columnIndex;


                        td.appendChild(
                            input
                        );


                        tr.appendChild(
                            td
                        );

                    }
                );


                const userInputTd =
                    document.createElement(
                        "td"
                    );


                const userInput =
                    document.createElement(
                        "input"
                    );


                userInput.type =
                    "text";


                userInput.className =
                    "new-row-user-input";


                userInput.placeholder =
                    "Enter value";


                userInputTd.appendChild(
                    userInput
                );


                tr.appendChild(
                    userInputTd
                );


                const actionTd =
                    document.createElement(
                        "td"
                    );


                const removeButton =
                    document.createElement(
                        "button"
                    );


                removeButton.textContent =
                    "Remove";


                removeButton.className =
                    "remove-button";


                removeButton.addEventListener(
                    "click",
                    function () {

                        tr.remove();

                    }
                );


                actionTd.appendChild(
                    removeButton
                );


                tr.appendChild(
                    actionTd
                );


                tbody.appendChild(
                    tr
                );


                status.textContent =
                    "New row added";

            }
        );



        // --------------------------------------------------
        // Build payload
        // --------------------------------------------------

        function buildPayload() {

            const records = [];


            // ----------------------------------------------
            // Existing Tableau rows
            // ----------------------------------------------

            const existingInputs =
                document.querySelectorAll(
                    ".user-input"
                );


            existingInputs.forEach(
                function (input) {

                    const userValue =
                        input.value.trim();


                    if (userValue === "") {

                        return;

                    }


                    const rowIndex =
                        Number(
                            input.dataset.rowIndex
                        );


                    const tableauRow =
                        currentDataTable
                            .data[rowIndex];


                    const rowObject = {};


                    currentDataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const cell =
                                tableauRow[
                                    columnIndex
                                ];


                            rowObject[
                                column.fieldName
                            ] =
                                cell.formattedValue ??
                                cell.value ??
                                "";

                        }
                    );


                    rowObject.UserInput =
                        userValue;


                    rowObject.recordType =
                        "existing";


                    records.push(
                        rowObject
                    );

                }
            );



            // ----------------------------------------------
            // New rows
            // ----------------------------------------------

            const newRows =
                document.querySelectorAll(
                    ".new-row"
                );


            newRows.forEach(
                function (newRow) {

                    const rowObject = {};

                    let hasValue = false;


                    currentDataTable.columns.forEach(
                        function (
                            column,
                            columnIndex
                        ) {

                            const input =
                                newRow.querySelector(
                                    `input[data-column-index="${columnIndex}"]`
                                );


                            const value =
                                input
                                    ? input.value.trim()
                                    : "";


                            rowObject[
                                column.fieldName
                            ] = value;


                            if (value !== "") {

                                hasValue =
                                    true;

                            }

                        }
                    );


                    const userInput =
                        newRow.querySelector(
                            ".new-row-user-input"
                        );


                    rowObject.UserInput =
                        userInput
                            ? userInput.value.trim()
                            : "";


                    if (
                        rowObject.UserInput !== ""
                    ) {

                        hasValue =
                            true;

                    }


                    if (!hasValue) {

                        return;

                    }


                    rowObject.recordType =
                        "new";


                    records.push(
                        rowObject
                    );

                }
            );


            return records;

        }



        // --------------------------------------------------
        // Submit All
        // --------------------------------------------------

        submitButton.addEventListener(
            "click",
            async function () {

                if (!currentDataTable) {

                    status.textContent =
                        "Select a worksheet first.";

                    return;

                }


                const records =
                    buildPayload();


                if (records.length === 0) {

                    status.textContent =
                        "No records to submit.";

                    return;

                }


                const requestPayload = {

                    worksheet:
                        currentWorksheetName,

                    records:
                        records

                };


                // Show the payload before sending

                payloadOutput.value =
                    JSON.stringify(
                        requestPayload,
                        null,
                        2
                    );


                payloadContainer.style.display =
                    "block";


                status.textContent =
                    "Submitting...";


                submitButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            WRITEBACK_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    /*
                                     * IMPORTANT:
                                     * Use text/plain instead
                                     * of application/json.
                                     *
                                     * This avoids the CORS
                                     * preflight problem found
                                     * in the previous POC.
                                     */

                                    "Content-Type":
                                        "text/plain"

                                },

                                body:
                                    JSON.stringify(
                                        requestPayload
                                    )

                            }
                        );


                    const responseText =
                        await response.text();


                    console.log(
                        "Apps Script response:",
                        responseText
                    );


                    let result = null;


                    try {

                        result =
                            JSON.parse(
                                responseText
                            );

                    }

                    catch (parseError) {

                        console.warn(
                            "Response was not JSON:",
                            responseText
                        );

                    }


                    if (
                        result &&
                        result.status === "success"
                    ) {

                        status.textContent =
                            records.length +
                            " record(s) submitted successfully.";

                    }

                    else if (
                        result &&
                        result.status === "error"
                    ) {

                        status.textContent =
                            "Submission failed: " +
                            result.message;

                    }

                    else if (
                        response.ok
                    ) {

                        status.textContent =
                            records.length +
                            " record(s) submitted.";

                    }

                    else {

                        status.textContent =
                            "Submission failed.";

                    }

                }

                catch (error) {

                    console.error(
                        "Writeback error:",
                        error
                    );


                    status.textContent =
                        "Unable to submit records.";

                }

                finally {

                    submitButton.disabled =
                        false;

                }

            }
        );

    </script>

</body>

</html>
